[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-pruning"
version = "0.1.0"
dependencies = [
	"torch",
	"transformers",
	"datasets",
	"gymnasium",
	"typer",
	"tqdm",
	"matplotlib",
	"pandas",
]
requires-python = ">=3.10"
[project.scripts]
rl-pruning = "rl_pruning.cli:app"

[dependency-groups]
dev = [
	"pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["rl_pruning"]
